.hotel{border-left:4px solid var(--blue)}.hotel.warm{border-left-color:var(--orange)}.daily{display:grid;gap:10px}.day-card{width:100%;border:1px solid var(--line);background:#fff;text-align:left;border-radius:14px;padding:0;overflow:hidden;display:grid;grid-template-columns:83px 1fr;cursor:pointer;box-shadow:var(--shadow);color:inherit}.day-card:active{transform:scale(.99)}.date-box{padding:15px 9px;background:var(--sky);text-align:center;color:var(--navy)}.date-box b{display:block;font-size:19px}.date-box span{font-size:12px}.date-box em{display:block;font-size:10px;font-style:normal;margin-top:6px;color:#32718e}.date-box.travel{background:#f3ecdf}.day-copy{padding:13px 14px;min-width:0}.day-copy h3{font-size:15px;margin:0 0 3px;color:var(--navy)}.day-copy p{font-size:12px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:11px;display:inline-block;margin-top:7px;background:#e7f3ed;color:#27694f;padding:2px 7px;border-radius:99px;font-weight:700}.pill.alert{background:#fff1e8;color:#a84f31}.detail-head{display:flex;gap:10px;align-items:center;margin:0 0 15px}.back{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.detail-head h2{font-size:21px;margin:0;color:var(--navy)}.detail-sub{color:var(--muted);font-size:13px;margin:3px 0 0}.timeline{border-left:2px solid #bddce7;margin:12px 0 18px;padding-left:17px}.slot{position:relative;margin:0 0 17px}.slot:before{content:"";width:10px;height:10px;border:3px solid #4e9ab9;border-radius:50%;background:#fff;position:absolute;left:-24px;top:6px}.slot b{display:block;color:var(--navy);font-size:14px}.slot p{margin:3px 0 0;font-size:13px}.slot small{color:var(--muted);display:block;font-size:12px;margin-top:2px}.callout{padding:12px 13px;border-radius:10px;background:#eef6f8;font-size:13px;margin:12px 0}.callout.warn{background:#fff3e6;border:1px solid #f6d8b0}.checklist{margin:8px 0 0;padding:0;list-style:none}.checklist li{font-size:13px;margin:7px 0;padding-left:23px;position:relative}.checklist li:before{content:"□";position:absolute;left:1px;color:var(--blue);font-weight:700}.source-links{font-size:12px;margin:8px 0 0;padding-left:18px}.source-links li{margin:5px 0}.budget-total{background:linear-gradient(135deg,var(--navy),#216f8c);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}.budget-total .big{font-size:25px;font-weight:800;margin-top:4px}.budget-total p{margin:2px 0 0;font-size:12px;opacity:.86}.budget-grid{display:grid;gap:8px}.budget-row{display:grid;grid-template-columns:1fr 122px;align-items:center;gap:9px}.budget-row label{font-weight:700;font-size:13px}.budget-row input,.expense-form input,.expense-form select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.rate{display:flex;align-items:center;gap:10px;font-size:13px;margin:10px 0 0}.rate input{width:105px;border:1px solid var(--line);border-radius:8px;padding:7px}.expense-form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.expense-form .wide{grid-column:1/-1}.primary{border:0;border-radius:10px;background:var(--orange);color:white;font-weight:800;padding:11px;cursor:pointer}.expense-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:13px 0}.mini{background:#f0f7f6;padding:12px;border-radius:10px}.mini span{font-size:11px;color:var(--muted);display:block}.mini b{font-size:16px;color:var(--green)}.expense-list{display:grid;gap:7px;margin-top:12px}.expense{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px}.expense small{display:block;color:var(--muted)}.delete{border:0;background:#f9e8e4;color:#a54735;border-radius:7px;padding:5px 7px;cursor:pointer}.tools{display:flex;gap:8px;margin-top:14px}.tools button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;color:var(--navy);font-weight:700 </style></head><body><div class="app"><header class="hero"><div class="eyebrow">FAMILY TRIP · SYDNEY</div><h1>시드니 가족여행</h1><p>2026.12.25 금 – 2027.01.03 일 · 부모님 + 초6 + 초3</p><div class="stats"><div class="stat"><b>8박 10일</b><span>연말·새해</span></div><div class="stat"><b>숙소 3곳</b><span>하버 → 시티 → 공항</span></div><div class="stat"><b>4인 가족</b><span>일정 · 예산 · 기록</span></div></div></header><nav class="tabs"><button class="active" data-tab="plan">일정</button><button data-tab="budget">예산·지출</button><button data-tab="info">예약·팁</button></nav><main id="appMain"></main></div>
<script>
const days=[
{d:'12.25',dow:'금',title:'인천 출발',tag:'출국',stay:'기내 1박',kind:'travel',summary:'20:00 인천 출발 · 공항 수속과 기내 휴식',slots:[['16:30','인천공항 도착','연말 출국 혼잡을 고려해 최소 3시간 30분 전 도착.'],['20:00','시드니행 출발','기내에서 26일 일정은 가볍게, 숙면 우선.']],check:['여권·ETA·여행자보험·숙소 바우처 오프라인 저장','아이들 기내 간식·충전기·보조배터리 준비']},
{d:'12.26',dow:'토',title:'도착 · 하버 산책',tag:'Day 1',stay:'Shangri-La 1박',summary:'08:20 도착 · The Rocks·Circular Quay · 장보기',slots:[['08:20','시드니 도착·입국','입국 수속 및 수하물 후 호텔에 짐 맡기기. 무리한 장거리 일정은 피하기.'],['11:30','The Rocks 브런치·하버 워크','호텔 주변 The Rocks → Circular Quay → 오페라하우스 외관. 사진과 시차 적응 중심.'],['15:00','샹그릴라 체크인·휴식','Grand Premier Sydney Harbour 객실에서 휴식.'],['17:30','Barangaroo 장보기','Woolworths Metro Barangaroo에서 조식·물·과일·샌드위치 재료를 2~3일치만 구매.'],['10:00','중요: NYE 무료 좌석 예약 시도','오페라하우스 Forecourt 무료 예약이 12/26 10:00 개시 예정. 항공편 지연 가능성을 고려해 가족 중 한 명이 바로 시도.']],check:['NYE Forecourt 4석 우선 예약: 12/31 12–15시 입장 조건 확인','호텔 얼리 체크인 불가 시 짐만 맡기고 산책','장보기 영수증은 지출 탭에 바로 기록']},
{d:'12.27',dow:'일',title:'타롱가 동물원',tag:'Day 2',stay:'Shangri-La 2박',summary:'F2 페리 · 타롱가 · 하버뷰 귀환',slots:[['08:30','Circular Quay로 이동','물·간식·자외선 차단제와 전날 산 과일을 챙기기.'],['09:00','F2 페리 → Taronga Zoo Wharf','Circular Quay에서 약 12분. 동물원은 이른 시간 동물이 더 활발하므로 개장 시간에 맞추기.'],['09:30–15:30','Taronga Zoo','온라인 가족권(2성인+2아동) 우선 확인. 호주 동물 구역·쇼를 우선, 점심은 피크닉으로 절약.'],['16:00','페리 귀환·Circular Quay','아이들 체력에 따라 호텔 휴식 또는 The Rocks 저녁 산책.'],['17:00 또는 14:00','선택: Great Opera Hits','오페라하우스 90분 공연. 아이 컨디션이 좋고 좌석이 있으면 선택, 피곤하면 과감히 생략.']],check:['Taronga 가족 온라인권 사전 구매','당일 발표·쇼 시간표 확인 후 동선 결정','페리·버스는 Opal/컨택리스 태그']},
{d:'12.28',dow:'월',title:'본다이 · 숙소 이동',tag:'Day 3',stay:'Furama 1박',summary:'샹그릴라 체크아웃 → Bondi Icebergs → Darling Harbour',slots:[['09:00','샹그릴라 체크아웃·짐 이동','Furama Darling Harbour에 짐 보관 요청. 이동은 택시/차량 1회로 짐 스트레스 줄이기.'],['10:30','Bondi Beach','기차로 Bondi Junction 후 333/380 버스, 또는 Circular Quay 출발 333 이용.'],['11:30','Bondi Icebergs 수영','파도·날씨·운영시간 확인 후 수영. 수영하지 않으면 카페와 해변 산책으로 대체.'],['14:00','Bondi to Bronte 짧은 구간 산책','무더위면 아이스버그 주변만 보고 즉시 휴식.'],['17:00','Furama 체크인·Darling Harbour','숙소 주변 야경 산책, 간단한 객실식/테이크아웃.']],check:['Icebergs 수영 복장·수건·샤워용품','해변 날씨/파도 경보 확인','호텔 이동 비용도 지출 탭에 기록']},
{d:'12.29',dow:'화',title:'포트스테판 3종 완주',tag:'Day 4',stay:'Furama 2박',summary:'Oakvale · 돌고래 크루즈 · Stockton 사막 샌드보딩',slots:[['06:45','렌터카/프라이빗 차량 출발','일반 시드니 출발 단체상품은 Oakvale 대신 Koala Sanctuary를 들르는 경우가 많음. 3종은 렌터카 또는 프라이빗 맞춤 차량으로 예약.'],['10:00–12:10','Oakvale Wildlife Park','10시 개장. 11시 아기 동물 수유, 12시 파충류 토크, 12:30 코알라 토크 중 체류시간에 맞춰 선택.'],['13:00–14:30','Nelson Bay 돌고래 크루즈','사전 예약한 90분 크루즈. 돌고래는 야생동물이므로 관찰 보장은 아님.'],['15:15–16:15','Anna Bay · Stockton Dunes','4WD + 샌드보딩. 운영사는 보통 15:30까지 시작 가능하므로 크루즈 시간 고정 후 재확인.'],['19:00 전후','시드니 귀환','저녁은 숙소 인근 간단식. 아이들 피로를 고려해 다음 날은 유연하게.']],check:['이 날은 표준 단체버스가 아닌 ‘Oakvale 포함 맞춤’ 예약 필요','차량 보험·카시트 필요 여부·톨비 확인','수영복·여벌옷·모래 털 수건·물 준비']},
{d:'12.30',dow:'수',title:'여유 시티 데이',tag:'Day 5',stay:'Furama 3박',summary:'전날 피로 회복 · Manly 또는 시내 공연 선택',slots:[['09:30','느긋한 조식·세탁·휴식','포트스테판 다음 날은 일정 강도를 낮춰 두기.'],['11:00','선택 A: Manly 페리','Circular Quay 왕복 페리와 Manly 해변. 무료/저비용 산책 중심.'],['11:00','선택 B: 시티 실내 코스','더위·비면 Australian Museum 또는 QVB·State Library 주변으로 교체.'],['17:00','선택 공연 또는 휴식','공연은 좌석·아이 컨디션·가격을 보고 확정. Opera House의 연말 프로그램을 출발 전 재확인.']],check:['31일 숙소 이동 전 빨래·짐 재정리','NYE 가방: 보조배터리·우비·간식·물·얇은 겉옷 준비','이 날은 쇼핑 예산 상한을 미리 정하기']},
{d:'12.31',dow:'목',title:'NYE 불꽃놀이',tag:'Day 6',stay:'Crowne Plaza Sydney Airport 1박',summary:'공항 호텔 이동 · 오페라하우스 포코트 · 새해맞이',slots:[['09:30','Furama 체크아웃·공항 호텔로 짐 이동','Crowne Plaza Sydney Airport by IHG에 체크인 또는 짐 보관. 차량보다 기차/택시 1회로 짐을 먼저 해결.'],['12:00–15:00','예약 시 Opera House Forecourt 입장','무료 예약을 확보한 경우 입장 가능 시간 내 입장. 간식·물·돗자리 규정은 예약 안내를 따르기.'],['오후','하버 주변 대기·이른 저녁','포코트 재입장이 제한될 수 있어 입장 전 규정을 확인. 피크닉 식품은 전날 장보기로 절약.'],['21:00 / 24:00','불꽃놀이','9pm 가족 불꽃놀이와 자정 불꽃놀이. 귀가 교통은 매우 혼잡하므로 대중교통·도보 이동 우선.'],['00:30 이후','Crowne Plaza 귀환','도로 통제와 승차공유 혼잡을 피하고, 행사 당일 Transport NSW 공지를 재확인.']],check:['Forecourt 예약 실패 시 공식 무료/유료 관람지 중 하나만 사전 선택','차량·렌터카로 시내 진입하지 않기','호텔까지 귀가 노선과 막차/증편 사전 캡처']},
{d:'01.01',dow:'금',title:'새해 휴식 · 공항권',tag:'Day 7',stay:'Crowne Plaza Sydney Airport 2박',summary:'늦은 시작 · 호텔 휴식 · Wolli Creek 장보기',slots:[['오전','늦은 조식·호텔 휴식','NYE 피로 회복을 최우선. 운영하지 않는 시설이 있을 수 있어 출발 전 영업 여부 확인.'],['오후','공항권 산책 또는 호텔 수영장','무리한 도심 왕복 대신 가벼운 일정.'],['16:00','Wolli Creek 장보기','다음 날 아침·간식·귀국용 간단식 구매. 공항 터미널보다 외부 슈퍼마켓이 경제적.'],['저녁','객실식·짐 정리','수하물 무게와 면세 구매 계획 정리.']],check:['1/1 영업시간은 매장별로 반드시 재확인','귀국 수하물 무게 제한 확인','여행 중 지출 총액 확인']},
{d:'01.02',dow:'토',title:'파머스 마켓 · 마지막 시티',tag:'Day 8',stay:'Crowne Plaza Sydney Airport 3박',summary:'Carriageworks Farmers Market · 마지막 기념품',slots:[['08:00–10:00','Carriageworks Farmers Market','토요일 8am–1pm. Redfern 역에서 도보 약 8분. 과일·빵·피크닉 식재료로 마지막 조식/선물 구매.'],['10:30','Redfern → 시티','Central/QVB/서점 등 마지막 기념품은 필요한 만큼만.'],['12:30','선택: La Bohème','오페라하우스 12:30 공연은 가족 성향·러닝타임·티켓 가격을 보고 선택. 공연 미선택 시 해변/공원으로 교체.'],['16:30','공항 호텔 귀환·짐 완성','여권·탑승권·여행자보험·환급 영수증을 한 파우치에 모으기.'],['18:00','이른 저녁·취침','다음 날 10:20 출발을 위해 과음·늦은 외출 피하기.']],check:['시장 현금/카드와 보냉가방 준비','마켓은 휴일 운영 변동 가능, 전날 재확인','귀국 전 지출 내역 내보내기']},

];
const hotels=[['12/26–12/28','Shangri-La Sydney','Grand Premier Sydney Harbour · 2박'],['12/28–12/31','Furama Darling Harbour','Darling Harbour · 3박'],['12/31–01/03','Crowne Plaza Sydney Airport by IHG','Sydney Airport · 3박']];
const defaultBudget={airfare:5800,hotel:2950,tours:980,food:1180,groceries:280,transport:420,nyE:0,shopping:600,contingency:650};
const labels={airfare:'항공권 4인',hotel:'숙소 8박',tours:'투어·입장권',food:'외식',groceries:'장보기',transport:'교통·차량',nyE:'NYE 관람',shopping:'쇼핑',contingency:'예비비'};
const store={getItem:k=>{try{return localStorage.getItem(k)}catch(e){return null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let budget=JSON.parse(store.getItem('sydBudget27')||'null')||defaultBudget;let expenses=JSON.parse(store.getItem('sydExpenses27')||'[]');let rate=Number(store.getItem('sydRate27')||950);let active='plan';let selectedDay=null;
const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Number(n)||0);const won=n=>new Intl.NumberFormat('ko-KR').format(Math.round((Number(n)||0)*rate))+'원';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){store.setItem('sydBudget27',JSON.stringify(budget));store.setItem('sydExpenses27',JSON.stringify(expenses));store.setItem('sydRate27',rate)}
function source(title,url){return '<li><a target="_blank" rel="noopener" href="'+url+'">'+title+'</a></li>'}
function overview(){return '<div class="notice">모바일에서 날짜 카드를 누르면 상세 일정으로 이동합니다. 시간·가격·운영일은 2026년 12월 출발 전 다시 확인하세요.</div><h2 class="section-title">항공</h2><div class="overview"><article class="card"><div class="label">출국 · ICN → SYD</div><h3>12/25 금 20:00</h3><p class="small">12/26 08:20 현지 도착</p></article><article class="card"><div class="label">귀국 · SYD → ICN</div><h3>01/03 일 10:20</h3><p class="small">인천 19:00 도착</p></article></div><h2 class="section-title">숙소</h2><div class="overview">'+hotels.map((h,i)=>'<article class="card hotel '+(i==2?'warm':'')+'"><div class="label">'+h[0]+'</div><h3>'+h[1]+'</h3><p class="small">'+h[2]+'</p></article>').join('')+'</div><h2 class="section-title">일자별 일정</h2><div class="daily">'+days.map((x,i)=>'<button class="day-card" onclick="showDay('+i+')"><div class="date-box '+(x.kind||'')+'"><b>'+x.d+'</b><span>'+x.dow+'</span><em>'+x.tag+'</em></div><div class="day-copy"><h3>'+x.title+'</h3><p>'+x.summary+'</p><span class="pill '+(x.tag==='NYE 불꽃놀이'?'alert':'')+'">'+x.stay+'</span></div></button>').join('')+'</div><p class="footer-note">이 앱의 지출 데이터는 현재 기기·브라우저의 저장공간에 보관됩니다. 예산 탭에서 JSON 백업을 내려받을 수 있습니다.</p>'}
function dayView(i){let x=days[i];return '<div class="detail-head"><button class="back" onclick="backPlan()">← 일정</button><div><h2>'+x.d+' '+x.dow+' · '+x.title+'</h2><p class="detail-sub">'+x.stay+'</p></div></div><div class="card"><div class="label">TODAY</div><h3>'+x.summary+'</h3><div class="timeline">'+x.slots.map(s=>'<div class="slot"><b>'+s[0]+' · '+s[1]+'</b><p>'+s[2]+'</p></div>').join('')+'</div><div class="callout '+(x.tag==='NYE 불꽃놀이'||x.d==='12.29'?'warn':'')+'"><b>오늘의 핵심</b><ul class="checklist">'+x.check.map(c=>'<li>'+c+'</li>').join('')+'</ul></div></div>'+daySources(x.d)}
function daySources(d){let s=[];if(d==='12.27')s=[source('Taronga 공식 티켓 가격','https://www.taronga.org.au/sydney-zoo/plan/visitor-information/ticket-prices'),source('Taronga 이동·페리 안내','https://www.taronga.org.au/sydney-zoo/plan/visitor-information/getting-here')];if(d==='12.29')s=[source('Oakvale 운영시간·공식 가격','https://oakvalewildlife.com.au/visit/location-opening-times'),source('Port Stephens Dolphins & Dunes 패키지','https://portstephens4wd.com.au/tours/dolphins-dune-package')];if(d==='12.31')s=[source('Opera House NYE Forecourt 무료 예약','https://www.sydneyoperahouse.com/experiences/new-years-eve-forecourt'),source('Sydney NYE 공식 교통 안내','https://www.sydneynewyearseve.com/transport')];if(d==='01.02')s=[source('Carriageworks Farmers Market','https://carriageworks.com.au/events/carriageworks-farmers-market/'),source('Opera Australia 1/2 La Bohème','https://opera.org.au/productions/la-boheme-sydney')];return s.length?'<div class="card" style="margin-top:12px"><div class="label">확인 링크</div><ul class="source-links">'+s.join('')+'</ul></div>':''}
function budgetView(){let estimate=Object.values(budget).reduce((a,b)=>a+Number(b||0),0),spent=expenses.reduce((a,b)=>a+Number(b.amount||0),0);return '<h2 class="section-title" style="margin-top:0">전체 예산</h2><div class="budget-total"><div class="label" style="color:#d5eef8">현재 추정 총액</div><div class="big">'+money(estimate)+'</div><p>약 '+won(estimate)+' · 1 AUD = '+rate+'원 기준 · 항공·숙소는 추정치이므로 실제 결제금으로 바꾸세요.</p></div><div class="card"><div class="label">예상 예산 수정</div><div class="budget-grid">'+Object.keys(budget).map(k=>'<div class="budget-row"><label for="b-'+k+'">'+labels[k]+'</label><input id="b-'+k+'" type="number" min="0" inputmode="decimal" value="'+budget[k]+'" onchange="changeBudget(&quot;'+k+'&quot;,this.value)"></div>').join('')+'</div><div class="rate">환율 <input type="number" value="'+rate+'" onchange="changeRate(this.value)"> 원 / AUD</div></div><h2 class="section-title">실제 사용 금액</h2><div class="card"><form class="expense-form" onsubmit="addExpense(event)"><select name="date">'+days.map(x=>'<option>'+x.d+'</option>').join('')+'</select><select name="cat">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select><input class="wide" required name="desc" maxlength="60" placeholder="내용 예: Woolworths 과일·물"><input required name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="금액 (AUD)"><button class="primary" type="submit">지출 저장</button></form><div class="expense-summary"><div class="mini"><span>실제 합계</span><b>'+money(spent)+'</b></div><div class="mini"><span>예산 잔액</span><b>'+money(estimate-spent)+'</b></div></div><div class="expense-list">'+(expenses.length?expenses.slice().reverse().map((e,i)=>'<div class="expense"><div><b>'+esc(e.desc)+'</b><small>'+e.date+' · '+labels[e.cat]+'</small></div><b>'+money(e.amount)+'</b><button class="delete" onclick="deleteExpense('+ (expenses.length-1-i) +')">삭제</button></div>').join(''):'<p class="offline">아직 기록한 지출이 없습니다. 영수증을 받으면 바로 한 건씩 저장하세요.</p>')+'</div><div class="tools"><button onclick="exportData()">JSON 백업</button><button onclick="clearExpenses()">지출만 초기화</button></div></div>'}
function infoView(){return '<h2 class="section-title" style="margin-top:0">예약·현지 팁</h2><div class="card"><div class="label">꼭 예약할 것</div><ul class="checklist"><li>12/26 10:00: Opera House Forecourt NYE 무료 티켓 4장 시도. 12/31 입장 시간과 반입 규정 확인.</li><li>12/29: Oakvale + 돌고래 크루즈 + Anna Bay 샌드보딩 시간을 한 차량 동선으로 확정. 표준 단체투어는 Oakvale를 포함하지 않는지 확인.</li><li>Taronga는 온라인 가족권, Icebergs는 날씨·운영시간, 렌터카는 보험·톨·카시트를 확인.</li></ul></div><div class="card" style="margin-top:12px"><div class="label">교통 절약</div><ul class="checklist"><li>Opal/컨택리스는 2026 공개 요금 기준 주말·공휴일 성인 일일 상한 AUD 9.65, 아동 AUD 4.80. 공항역 접근료는 별도라 공항철도 이용 횟수를 줄이세요.</li><li>Taronga는 Circular Quay에서 F2 페리, Bondi는 333 또는 Bondi Junction 경유가 편합니다.</li><li>NYE는 도로 통제와 승차공유 혼잡이 크므로 렌터카로 시내에 들어가지 말고 현행 교통 공지를 당일 확인하세요.</li></ul></div><div class="card" style="margin-top:12px"><div class="label">장보기·식비</div><ul class="checklist"><li>도착일 Barangaroo Woolworths Metro에서 물·과일·조식·피크닉 재료를 구매하고, 1/1에는 Wolli Creek에서 귀국 전 간식만 보충.</li><li>동물원·해변·NYE 대기일에는 물·간식·과일·샌드위치를 챙기면 현장 식비를 크게 줄일 수 있습니다.</li><li>12/25 크리스마스는 NSW 대부분 소매점이 휴무 대상이므로 장보기를 기대하지 마세요.</li></ul></div><div class="card" style="margin-top:12px"><div class="label">출처·최종 확인</div><ul class="source-links">'+source('Transport for NSW 요금 안내','https://www.transport.nsw.gov.au/system/files/media/documents/2026/public-transport-fares-and-ticketing-brochure.pdf')+source('Airport Link 요금','https://airportlink.com.au/trip-information/price')+source('Carriageworks 공식 시장 안내','https://carriageworks.com.au/events/carriageworks-farmers-market/')+source('Sydney Opera House Kids & Families','https://www.sydneyoperahouse.com/kids-families')+'</ul><p class="offline">운영시간, 가격, 공연 및 NYE 교통은 변경될 수 있어 출발 전과 행사 전날 공식 링크로 재확인이 필요합니다.</p></div>'}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));document.getElementById('appMain').innerHTML=selectedDay!==null?dayView(selectedDay):(active==='plan'?overview():active==='budget'?budgetView():infoView)}
function showDay(i){selectedDay=i;render();window.scrollTo({top:0,behavior:'smooth'})}function backPlan(){selectedDay=null;active='plan';render();window.scrollTo(0,0)}function changeBudget(k,v){budget[k]=Number(v)||0;save();render()}function changeRate(v){rate=Number(v)||0;save();render()}function addExpense(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!amount)return;expenses.push({date:f.get('date'),cat:f.get('cat'),desc:f.get('desc'),amount,at:new Date().toISOString()});save();render()}function deleteExpense(i){expenses.splice(i,1);save();render()}function clearExpenses(){if(confirm('저장된 지출 기록만 모두 지울까요?')){expenses=[];save();render()}}function exportData(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),budget,rate,expenses},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sydney-trip-expenses-2026-2027.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;selectedDay=null;render()}));window.addEventListener('hashchange',render);render();
</script></body></html>
