<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#36423F">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시드니 여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>시드니 가족여행 2026–27</title>
<style>
:root{
  --bg:#E7E3DC;--surface:#F2EFE9;--surface2:#E3DED5;--ink:#2F3538;--muted:#6E746F;--line:#D5CEC3;
  --accent:#5E8682;--accent-ink:#3F625F;--accent-soft:#D6E0DB;--warm:#B5806A;--warm-soft:#EBDDD3;
  --dark:#36423F;--dark2:#2B3533;--on-dark:#EEE9E1;--on-dark-muted:#B9B5AC;--danger:#A65F55;
  --r:18px;--shadow:0 1px 2px rgba(40,45,42,.05),0 8px 20px rgba(40,45,42,.06);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(78px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}
svg.i{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.wrap{max-width:560px;margin:0 auto}
/* header */
header.top{position:sticky;top:0;z-index:30;background:rgba(231,227,220,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(12px + var(--safe-t)) 16px 6px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.brand b{display:block;font-size:20px;letter-spacing:-.02em;line-height:1.25}
.dday{border:0;font-size:12px;font-weight:700;background:var(--dark);color:var(--on-dark);border-radius:999px;padding:7px 12px;white-space:nowrap}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 0 7px;width:52px;text-align:center}
.chip span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.chip b{display:block;font-size:17px;line-height:1.2;font-weight:700}
.chip.today{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm)}
.chip.on{background:var(--dark);border-color:var(--dark);color:var(--on-dark);box-shadow:none}
.chip.on span{color:var(--on-dark-muted)}
.chip.all{width:auto;padding:6px 12px}
main{padding:10px 14px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
h2,h3{margin:0;letter-spacing:-.01em}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:22px 4px 10px}
/* next up */
.next{background:var(--dark);color:var(--on-dark);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.next small{font-size:11px;letter-spacing:.12em;color:var(--on-dark-muted);font-weight:700}
.next h3{font-size:18px;margin:4px 0 2px}
.next p{margin:0;color:var(--on-dark-muted);font-size:13px}
.next .row{display:flex;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--ink)}
.btn.dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:var(--on-dark)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#F4F1EB}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#F7F1EC}
.btn.ghost{background:transparent}
.btn.block{width:100%;padding:12px}
.btn.danger{color:var(--danger)}
/* day head */
.dayhead h2{font-size:21px;margin:6px 0 4px}
.dayhead p{margin:0;font-size:13.5px}
.dh-top{display:flex;align-items:center;gap:8px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.pill.warm{background:var(--warm-soft);color:#8A5A45}
.stay{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--ink);font-size:13px;font-weight:600}
.stay .i{color:#8C7E9C}
.stay em{margin-left:auto;font-style:normal;color:var(--muted);font-weight:500;font-size:12px}
/* timeline */
.tl{margin-top:14px}
.it{display:grid;grid-template-columns:46px 26px 1fr;gap:0 8px;align-items:start}
.it-time{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:13px;text-align:right;line-height:1.25;word-break:keep-all}
.it-rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.it-rail:before{content:"";position:absolute;top:0;bottom:-10px;width:2px;background:var(--line)}
.it:last-child .it-rail:before{bottom:auto;height:22px}
.it-dot{position:relative;margin-top:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F6F3EE;box-shadow:0 0 0 3px var(--bg)}
.it-dot .i{width:14px;height:14px}
.it-body{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:10px;box-shadow:var(--shadow);min-width:0}
.it.opt .it-body{background:transparent;border-style:dashed;box-shadow:none}
.it-title{font-weight:700;font-size:14.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.it-body p{margin:4px 0 0;font-size:13px;color:#4E5552}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.warm{background:var(--warm-soft);color:#8A5A45}
.it-act{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;font-weight:600}
.it-act a{display:inline-flex;align-items:center;gap:4px}
.cost{margin-left:auto;color:var(--muted);font-weight:600}
.go{display:grid;grid-template-columns:46px 26px 1fr;gap:0 8px;align-items:center;margin:-4px 0 6px}
.go-rail{align-self:stretch;display:flex;justify-content:center;position:relative}
.go-rail:before{content:"";position:absolute;top:-6px;bottom:-6px;width:2px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.go-txt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.go-txt span{overflow:hidden;text-overflow:ellipsis}
.go-txt a{margin-left:auto;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:999px;background:var(--accent-soft)}
.check{list-style:none;margin:8px 0 0;padding:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.check li:first-child{border-top:0}
.box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid #A9A398;margin-top:1px;display:flex;align-items:center;justify-content:center}
.check li.done .box{background:var(--accent);border-color:var(--accent)}
.check li.done .box:after{content:"";width:9px;height:5px;border:2px solid #F4F1EB;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check li.done span{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:11.5px;text-decoration:none}
/* overview */
.ov-sum{background:var(--dark);color:var(--on-dark);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ov-sum small{color:var(--on-dark-muted);font-size:11px;letter-spacing:.12em;font-weight:700}
.ov-sum h2{font-size:19px;margin:4px 0 2px}
.ov-sum p{margin:0;color:var(--on-dark-muted);font-size:12.5px}
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;text-align:center}
.ov-stats div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 2px;font-size:11px;color:var(--on-dark-muted)}
.ov-stats b{display:block;font-size:16px;color:var(--on-dark)}
.hbar{display:flex;gap:3px;margin-top:14px}
.hbar div{border-radius:8px;padding:6px 7px;font-size:10.5px;line-height:1.3;color:#F6F3EE;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hbar div b{display:block;font-size:11.5px}
.ov-list{margin-top:12px;display:grid;gap:8px}
.ov-row{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);text-align:left;width:100%}
.ov-row.today{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm),var(--shadow)}
.ov-date{border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.ov-date span{font-size:11px;color:var(--muted)}
.ov-date b{font-size:17px;line-height:1.2}
.ov-date em{font-style:normal;font-size:10px;font-weight:700;color:var(--accent-ink)}
.ov-row.travel .ov-date{background:var(--warm-soft)}
.ov-row.travel .ov-date em{color:#8A5A45}
.ov-body{min-width:0}
.ov-body h3{font-size:14.5px;margin:1px 0 5px;display:flex;align-items:center;gap:6px}
.ov-body h3 .i{color:var(--muted);margin-left:auto;width:15px;height:15px}
.hls{display:flex;flex-wrap:wrap;gap:5px}
.hl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:#4E5552;max-width:100%}
.hl .i{width:12px;height:12px}
.hl.must{background:var(--warm-soft);color:#8A5A45}
.ov-stay{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.ov-stay i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.daynav{display:flex;gap:10px;margin-top:16px}
.daynav .btn{flex:1}
/* map */
.mapbox{height:calc(100vh - 250px);min-height:340px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.mapbox.day{height:300px;min-height:0}
.route-bar{display:flex;gap:8px;margin-top:8px}
.route-bar .btn{flex:1}
.route-list{display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.route-list .mk{width:20px;height:20px;font-size:10.5px;border-width:1.5px;box-shadow:none}
.route-list .rs{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.route-list span.nm{margin-right:6px;color:var(--ink);font-weight:600}
.mk{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:700;border:2px solid #F2EFE9;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.plist{margin-top:12px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.prow .mk{flex:0 0 auto}
.prow div{min-width:0;flex:1}
.prow small{display:block;color:var(--muted);font-size:12px}
.map-msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.mapbox .leaflet-tile-pane{filter:saturate(.5) sepia(.15) brightness(.97) contrast(.95)}
.mapbox.leaflet-container{background:#E3DED5}
/* money */
.sum{background:var(--dark);color:var(--on-dark);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.sum small{color:var(--on-dark-muted);font-size:12px;font-weight:600}
.sum .big{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:12px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;background:#C99C84}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;color:var(--on-dark-muted)}
.sum-grid b{display:block;color:var(--on-dark);font-size:14.5px}
.actions2{display:flex;gap:8px;margin-top:12px}
.actions2 .btn{flex:1}
.catrow{padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .l{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.catrow .l span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.cbar{height:6px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:99px}
.cbar i.over{background:var(--danger)!important}
.daytot{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.daytot::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;min-width:76px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.dt b{display:block;font-size:14px;color:var(--ink)}
.dt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.exp{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.exp .ci{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#F6F3EE;flex:0 0 auto}
.exp div.t{flex:1;min-width:0}
.exp div.t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp div.t small{color:var(--muted);font-size:12px}
.exp .amt{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.exp .amt small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13.5px}
/* prep */
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.bk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0;padding-top:2px}
.bk .ci{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#F6F3EE;flex:0 0 auto}
.bk b{display:block;font-size:14px}
.bk small{display:block;color:var(--muted);font-size:12.5px}
.links a{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
.links a:first-child{border-top:0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.setrow:first-child{border-top:0}
.setrow small{display:block;color:var(--muted);font-size:12px}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:#C9C3B8;border:0;flex:0 0 auto;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F7F4EF;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on:after{left:21px}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.55}
/* tab bar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(242,239,233,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + var(--safe-b))}
nav.tabbar .wrap{display:flex}
nav.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabbar button .i{width:22px;height:22px;stroke-width:1.8}
nav.tabbar button.on{color:var(--dark)}
nav.tabbar button.on .i{stroke-width:2.2}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + var(--safe-b));z-index:35;width:54px;height:54px;border-radius:50%;border:0;background:var(--warm);color:#fff;box-shadow:0 8px 20px rgba(80,50,35,.28);display:flex;align-items:center;justify-content:center}
.fab .i{width:24px;height:24px}
/* sheet */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(30,34,32,.42);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:99px;background:#CFC8BD;margin:0 auto 12px}
.sheet h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:#F8F6F2;border-radius:12px;padding:11px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.catgrid button{border:1px solid var(--line);background:#F8F6F2;border-radius:10px;padding:8px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.catgrid button.on{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bud{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud small{grid-column:1/-1;color:var(--muted);font-size:11.5px;line-height:1.4}
.bud .inp{padding:8px 10px;text-align:right}
/* lock */
.lock{position:fixed;inset:0;z-index:80;background:var(--dark);color:var(--on-dark);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.lock.show{display:flex}
.lock h3{font-size:18px;margin:14px 0 4px}
.lock p{margin:0;color:var(--on-dark-muted);font-size:13px;min-height:20px}
.dots{display:flex;gap:14px;margin:22px 0 26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--on-dark-muted)}
.dots i.f{background:var(--on-dark);border-color:var(--on-dark)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--on-dark);font-size:24px;font-weight:500}
.pad button.t{background:transparent;font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sheet .pad{margin:0 auto;grid-template-columns:repeat(3,64px)}
.sheet .pad button{height:64px;background:var(--surface2);color:var(--ink)}
.sheet .pad button.t{background:transparent}

const dObj=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const dLabel=s=>{const d=dObj(s);return {m:d.getUTCMonth()+1,d:d.getUTCDate(),w:DOW[d.getUTCDay()]}};
const tzDate=tz=>new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

 h+=DAYS.map((d,i)=>{const L=dLabel(d.date);const on=((S.tab==='map'&&S.mapAll)||(S.tab==='plan'&&S.overview))?false:i===S.day;return `<button class="chip ${on?'on':''} ${i===ti?'today':''}" data-day="${i}"><span>${L.m}/${L.d}</span><b>${L.w}</b></button>`}).join('');

}

function timeVal(t){const m=String(t).match(/(\d{1,2}):(\d{2})/);if(!m)return -1;let h=+m[1];if(h<5)h+=24;return h*60+ +m[2]}
function nextUp(d){
 const now=timeVal(tzTime('Australia/Sydney'));
 const it=d.items.find(x=>timeVal(x.t)>=now-15);
 if(!it) return `<section class="next"><small>오늘 일정 끝</small><h3>수고했어요. 푹 쉬세요</h3><p>내일 일정은 위 날짜를 눌러 확인</p></section>`;

 return `<section class="next"><small>다음 일정 · ${esc(it.t)}</small><h3>${esc(it.title)}</h3><p>${pl?esc(pl.n):''}</p>

}

function checkLi(id,text,sub,url){const on=!!checks[id];return `<li class="${on?'done':''}" data-check="${id}"><i class="box"></i><span>${esc(text)}${sub?`<small>${esc(sub)}${url?` · <a href="${url}" target="_blank" rel="noopener" data-stop="1">링크</a>`:''}</small>`:''}</span></li>`}
function dayStops(d){
 const seq=[];
 const di=DAYS.indexOf(d),prev=DAYS[di-1];
 if(prev&&prev.stayP&&P[prev.stayP].ll)seq.push({key:prev.stayP,pl:P[prev.stayP],it:{t:'출발',title:'숙소에서 출발'}});
 d.items.forEach(it=>{if(it.opt||!it.p)return;const pl=P[it.p];if(!pl||!pl.ll)return;if(seq.length&&seq[seq.length-1].key===it.p)return;seq.push({key:it.p,pl,it})});
 const uniq=[];seq.forEach((s,i)=>{let u=uniq.find(x=>x.key===s.key);if(!u){u={key:s.key,pl:s.pl,orders:[],items:[]};uniq.push(u)}u.orders.push(i+1);u.items.push(s.it)});
 return {seq,uniq};
}
function routeUrl(seq){
 if(seq.length<2)return seq[0]?mapQ(seq[0].pl.q):'#';
 const q=seq.map(s=>s.pl.q);const mid=q.slice(1,-1).slice(0,8);
 return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(q[0])+'&destination='+encodeURIComponent(q[q.length-1])+(mid.length?'&waypoints='+encodeURIComponent(mid.join('|')):'');
}

let LMAP=null,leafletP=null;
function loadLeaflet(){
 if(window.L) return Promise.resolve();
 if(leafletP) return leafletP;
 leafletP=new Promise((res,rej)=>{
  const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
  const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=res;s.onerror=()=>{leafletP=null;rej()};document.head.appendChild(s);
 });
 return leafletP;

function mapPoints(){
 const idxs=S.mapAll?DAYS.map((_,i)=>i):[S.day];
 const out=[];
 idxs.forEach(i=>{const seen=new Set();DAYS[i].items.forEach(it=>{if(!it.p)return;const pl=P[it.p];if(!pl.ll||seen.has(it.p))return;seen.add(it.p);out.push({day:i,pl,it,key:it.p})})});
 return out;
}

 openSheet(`<h3>예산 수정 (A$)<button class="icon-btn" data-act="close">${ico('x')}</button></h3>
 ${CATS.map(c=>`<div class="bud"><b>${c.l}</b><input class="inp" type="number" inputmode="decimal" min="0" data-bud="${c.k}" value="${budget[c.k]}"><small>${c.n}</small></div>`).join('')}
 <button class="btn primary block" style="margin-top:14px" data-act="saveBud">저장</button>
 <button class="btn ghost block" data-act="resetBud">추정치로 되돌리기</button>`);
}
function sheetRate(){
 openSheet(`<h3>환율<button class="icon-btn" data-act="close">${ico('x')}</button></h3><div class="field"><label>1 AUD = ? 원</label><input class="inp" id="fRate" type="number" inputmode="decimal" value="${rate}"></div><button class="btn primary block" data-act="saveRate">저장</button>`);
}

/* ---------- lock ---------- */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('syd27:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function padHtml(){return `<div class="dots">${'<i></i>'.repeat(4)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="t" data-k="c">취소</button><button data-k="0">0</button><button class="t" data-k="b">지우기</button></div>`}
function runPad(root,onFull,onCancel){
 let v='';const dots=root.querySelectorAll('.dots i');
 const paint=()=>dots.forEach((d,i)=>d.classList.toggle('f',i<v.length));
 root.querySelector('.pad').onclick=e=>{const k=e.target.closest('button')?.dataset.k;if(k==null)return;
  if(k==='b'){v=v.slice(0,-1)}else if(k==='c'){onCancel&&onCancel();return}else if(v.length<4){v+=k}
  paint();if(v.length===4){const val=v;setTimeout(()=>{v='';paint();onFull(val)},120)}};
 paint();
}
function showLock(){
 const el=$('#lock');
 el.innerHTML=`${ico('lock')}<h3>시드니 가족여행</h3><p id="lockMsg">비밀번호 4자리를 입력하세요</p>${padHtml()}`;
 el.querySelector('svg').style.cssText='width:30px;height:30px';
 el.querySelector('[data-k="c"]').style.visibility='hidden';
 el.classList.add('show');
 runPad(el,async v=>{
  if(await sha(v)===store.get('pin',null)){sessionStorage.setItem('syd27_ok','1');el.classList.remove('show');el.innerHTML=''}
  else{const m=$('#lockMsg');m.textContent='비밀번호가 맞지 않아요';el.querySelector('.dots').classList.remove('shake');void el.offsetWidth;el.querySelector('.dots').classList.add('shake')}
 });
}
function sheetLock(){
 const on=!!store.get('pin',null);
 if(on){
  openSheet(`<h3>잠금 끄기<button class="icon-btn" data-act="close">${ico('x')}</button></h3><p class="muted" id="pm" style="text-align:center;margin:0">현재 비밀번호를 입력하세요</p>${padHtml()}`);
  runPad($('#sheet'),async v=>{if(await sha(v)===store.get('pin',null)){store.del('pin');closeSheet();render();toast('잠금을 껐어요')}else{$('#pm').textContent='비밀번호가 맞지 않아요'}},closeSheet);
 }else{
  openSheet(`<h3>잠금 켜기<button class="icon-btn" data-act="close">${ico('x')}</button></h3><p class="muted" id="pm" style="text-align:center;margin:0">새 비밀번호 4자리</p>${padHtml()}`);
  let first=null;
  runPad($('#sheet'),async v=>{
   if(first===null){first=v;$('#pm').textContent='한 번 더 입력하세요'}
   else if(first===v){store.set('pin',await sha(v));sessionStorage.setItem('syd27_ok','1');closeSheet();render();toast('잠금을 켰어요')}
   else{first=null;$('#pm').textContent='서로 달라요. 새 비밀번호를 다시 입력하세요'}
  },closeSheet);
 }
}

/* ---------- export / import ---------- */
function exportData(){
 const data={app:'sydney-trip-2026',exportedAt:new Date().toISOString(),budget,rate,expenses,checks};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sydney-trip-backup-'+tzDate('Asia/Seoul')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast('백업 파일을 저장했어요');
}
function importData(file){
 const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.expenses))throw 0;
  if(!confirm('백업 파일로 지금 기록을 바꿀까요? (지출 '+d.expenses.length+'건)'))return;
  expenses=d.expenses;budget=Object.assign({},DEF_BUDGET,d.budget||{});rate=d.rate||rate;checks=d.checks||checks;saveAll();render();toast('불러왔어요')}catch(e){toast('올바른 백업 파일이 아니에요')}};
 r.readAsText(file);
}

/* ---------- render & events ---------- */
const TABS=[['plan','일정','cal'],['map','지도','map'],['money','지출','wallet'],['prep','준비','list']];
function render(){
 if(!TABS.some(t=>t[0]===S.tab))S.tab='plan';
 $('#tabs').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${ico(t[2])}${t[1]}</button>`).join('');
 renderHeader();
 if(S.tab!=='map'&&LMAP){LMAP.remove();LMAP=null}
 if(DMAP){DMAP.remove();DMAP=null}
 const m=$('#main');
 m.innerHTML=S.tab==='plan'?renderPlan():S.tab==='map'?renderMap():S.tab==='money'?renderMoney():renderPrep();
 if(S.tab==='map')initMap();
 const fab=$('#fab');fab.innerHTML=ico('plus');fab.style.display=(S.tab==='plan'||S.tab==='money')?'flex':'none';
}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('[data-stop]'))return;
 const tab=t.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;store.set('tab',S.tab);render();scrollTo(0,0);return}
 const day=t.closest('[data-day]');if(day){S.day=+day.dataset.day;S.mapAll=false;S.overview=false;render();if(S.tab==='plan')scrollTo({top:0,behavior:'smooth'});return}
 if(t.closest('[data-ov]')){S.overview=true;render();scrollTo({top:0,behavior:'smooth'});return}
 if(t.closest('[data-all]')){S.mapAll=true;render();return}
 if(t.closest('[data-bigmap]')){S.tab='map';S.mapAll=false;store.set('tab','map');render();scrollTo(0,0);return}
 const go=t.closest('[data-go]');if(go&&!go.disabled){S.day=Math.max(0,Math.min(DAYS.length-1,S.day+ +go.dataset.go));render();scrollTo({top:0,behavior:'smooth'});return}
 if(t.closest('#dday')){const ti=todayIdx();S.tab='plan';if(ti>=0){S.day=ti;S.overview=false}else{S.overview=true}render();return}
 if(t.closest('#fab')){sheetAdd();return}
 const ck=t.closest('[data-check]');if(ck){const id=ck.dataset.check;checks[id]=!checks[id];saveAll();ck.classList.toggle('done',checks[id]);return}
 const ed=t.closest('[data-expday]');if(ed){S.expDay=ed.dataset.expday||null;render();return}
 const del=t.closest('[data-del]');if(del){if(confirm('이 지출을 삭제할까요?')){expenses=expenses.filter(x=>x.id!==del.dataset.del);saveAll();render()}return}
 const sb=t.closest('.seg button,.catgrid button');if(sb){sb.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));sb.classList.add('on');return}
 const act=t.closest('[data-act]');if(!act)return;
 switch(act.dataset.act){
  case 'add':sheetAdd();break;
  case 'budget':sheetBudget();break;
  case 'close':closeSheet();break;
  case 'saveExp':saveExp();break;
  case 'saveBud':document.querySelectorAll('[data-bud]').forEach(i=>budget[i.dataset.bud]=Math.max(0,parseFloat(i.value)||0));saveAll();closeSheet();render();toast('예산을 저장했어요');break;
  case 'resetBud':budget=Object.assign({},DEF_BUDGET);saveAll();closeSheet();render();toast('추정치로 되돌렸어요');break;
  case 'rate':sheetRate();break;
  case 'saveRate':{const v=parseFloat($('#fRate').value);if(v>0){rate=v;saveAll()}closeSheet();render();break}
  case 'lock':sheetLock();break;
  case 'export':exportData();break;
  case 'import':$('#importFile').click();break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
/* swipe between days on plan */
let sx=0,sy=0;
$('#main').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#main').addEventListener('touchend',e=>{if(S.tab!=='plan'||S.overview)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<40){const n=S.day+(dx<0?1:-1);if(n>=0&&n<DAYS.length){S.day=n;render();scrollTo({top:0})}}},{passive:true});

/* ---------- start ---------- */
(function start(){
 const ti=todayIdx();S.day=ti>=0?ti:store.get('day',0);S.overview=ti<0;
 window.addEventListener('pagehide',()=>store.set('day',S.day));
 render();
 if(store.get('pin',null)&&sessionStorage.getItem('syd27_ok')!=='1')showLock();
 if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
 setInterval(()=>{if(S.tab==='plan'&&todayIdx()===S.day&&!$('#overlay').classList.contains('show'))render()},60000);
})();
</script>
